name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    name: apps/web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        # CI recovery fix: pinned at 20.11.0 (a Node 20.x point release
        # that predates Node's require(esm) interop support entirely --
        # that landed in 20.19.0/22.12.0). vite@7.x (a transitive
        # dependency of vitest@3.x, bumped in the prior production-
        # hardening phase to close a Critical CVE) ships as pure ESM
        # with zero CommonJS export at all (verified directly against
        # node_modules/vite/package.json: "type": "module", a single
        # unconditional "." export, no "require" condition). vitest's
        # own CJS entrypoint (index.cjs -> dist/config.cjs) requires()
        # vite internally; on a Node version with no require(esm)
        # support that throws ERR_REQUIRE_ESM outright -- exactly the
        # observed CI failure. It doesn't reproduce on a modern local
        # Node (which has full require(esm) support), which is why it
        # only ever surfaced in CI. Node 20.x LTS is also EOL as of this
        # phase -- bumping to current Node 24.x LTS both fixes the
        # interop gap (the officially sanctioned mechanism for a
        # CJS-by-default project to consume a pure-ESM dependency, not a
        # workaround) and gets CI off an end-of-life runtime.
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        # Phase 8.5 fix: this step never existed, so the 28 test files /
        # 193 tests under apps/web (including auth/MFA/rate-limit/
        # authorization coverage) never gated a merge -- a regression here
        # would pass CI silently. vitest.config.ts already provides its own
        # placeholder env vars, so no extra `env:` block is needed here.
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholder values sufficient for a build-time check only.
          # Real secrets are injected by Vercel at deploy time, never committed here.
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          NEXT_PUBLIC_APP_URL: "https://placeholder.championsstake.app"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
          RESEND_API_KEY: "placeholder"

  edge-functions:
    name: supabase/functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        # Phase 8.5 fix: deno.lock existed but was never used to key a
        # cache, so every CI run re-fetched every npm:/jsr: import fresh.
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Deno format check
        run: deno fmt --check supabase/functions/

      - name: Deno lint
        run: deno lint supabase/functions/

      - name: Deno type check
        # Each function is its own Deno entry point; type-checking every
        # index.ts transitively covers every _shared/_wallet/_challenge/etc.
        # module it imports. This job never existed before the runtimes were
        # physically separated — previously the Next.js tsconfig accidentally
        # (and incorrectly) tried to cover this code instead of Deno's own
        # toolchain verifying it.
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f"
            deno check "$f"
          done

      - name: Deno tests
        # Phase 8.5 fix: this step never existed, so the 26 Deno test files
        # (including the wallet-ledger double-entry-balance tests and every
        # bracket-format test) never gated a merge.
        run: deno test --allow-env supabase/functions/
